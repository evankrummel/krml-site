<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: dark)">
  <title>Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Preload foreground image for instant rendering with the preloader -->
  <link rel="preload" as="image" href="../images/foreground.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-blue': '#242c3d',
            'cream': '#e9e1db'
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-dark-blue dark:bg-dark-blue text-dark-blue dark:text-dark-blue flex flex-col items-center justify-center h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="../images/krml25-wordmark-cream.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Core Content -->
  <div id="main-content" class="h-full w-full flex flex-col items-center justify-center transition-all duration-500">

    <!-- Navigation -->
    <nav id="navbar" class="fixed top-8 left-1/2 -translate-x-1/2 w-auto px-4 py-2.5 
                           shadow-lg transition-all duration-300 z-50 flex items-center">
      <div id="nav-links-container" class="relative flex items-center justify-between gap-x-24 md:gap-x-32 z-10 dashiell-text h-full">
        <a href="../work" id="work-link" class="nav-link text-sm md:text-base px-4 py-1.5 pt-2 leading-none flex items-center">projects</a>

        <a href="../" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center hover:scale-[1.03] transition-transform duration-300">
          <img id="wordmark-logo" src="../images/krml25-wordmark-cream.svg" alt="Logo" class="h-6 md:h-8 w-auto object-contain">
        </a>

        <a href="javascript:void(0);" id="contact-link" class="nav-link active cursor-default text-sm md:text-base px-4 py-1.5 pt-2 leading-none flex items-center tracking-[0.03em]">contact</a>
      </div>
    </nav>

    <!-- Background -->
    <div class="background-image absolute inset-0 -z-30 will-change-transform"></div>

    <div class="absolute inset-0 -z-10 bg-black opacity-10"></div>

    <!-- Foreground Image Layer -->
    <div class="foreground-image absolute inset-0 z-5 pointer-events-none will-change-transform"></div>

    <!-- Contact Content -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-24 md:py-32 relative w-full">
      <div class="relative w-[90%] md:w-[150%] max-w-md h-[360px] md:h-[60%] flex flex-col items-center justify-center">
        <!-- Background Box Layer -->
        <div class="contact-box absolute inset-0 rounded-xl z-0 pointer-events-none"></div>

        <!-- Content Layer -->
        <div
          class="text-dark-blue dashiell-text w-full h-full py-4 px-6 flex flex-col items-center justify-center space-y-3 text-center relative z-10">
          <img src="../images/circle-contact.png" alt="Evan Krummel" class="w-28 h-28 object-cover rounded-lg">
          
          <h3 class="h1-text text-3xl font-bold text-dark-blue">Evan Krummel</h3>

          <p class="text-xl font-medium text-dark-blue">Student & Creative Professional</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Social Links -->
  <div class="fixed bottom-8 flex space-x-4 z-10">
    <a href="mailto:evan@krml.me?subject=%F0%9F%91%8B" target="_blank" class="social-link w-7 h-7">
      <img src="../images/mail-cream.png" alt="Mail Icon" class="w-full h-full">
    </a>
    <a href="http://instagram.com/evankrummel/" target="_blank" class="social-link w-7 h-7">
      <img src="../images/insta-cream.png" alt="Instagram Icon" class="w-full h-full">
    </a>
    <a href="https://www.linkedin.com/in/krml" target="_blank" class="social-link w-7 h-7">
      <img src="../images/linkedin-cream.png" alt="LinkedIn Icon" class="w-full h-full">
    </a>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
