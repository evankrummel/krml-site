<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: dark)">
  <title>Work - Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/work">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Preload foreground image for instant rendering with the preloader -->
  <link rel="preload" as="image" href="../images/foreground.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-blue': '#242c3d',
            'cream': '#e9e1db'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-dark-blue dark:bg-dark-blue text-dark-blue dark:text-dark-blue min-h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="../images/krml25-wordmark-cream.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Main Content -->
  <div id="main-content" class="min-h-screen w-full flex flex-col transition-all duration-500">

    <!-- Background -->
    <div class="background-image fixed inset-0 -z-30 will-change-transform"></div>
    <div class="fixed inset-0 -z-10 bg-black opacity-10"></div>

    <!-- Foreground Image Layer -->
    <div class="foreground-image fixed inset-0 z-5 pointer-events-none will-change-transform"></div>

    <!-- Navigation -->
    <nav id="navbar" class="fixed top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md md:max-w-lg px-6 py-3 
                           shadow-lg transition-all duration-300 z-50">
      <div class="flex items-center justify-between">
        <!-- Wordmark -->
        <a href="../index.html">
          <img id="wordmark-logo" src="../images/krml25-wordmark-cream.svg" alt="Logo" class="h-8">
        </a>

        <!-- Links -->
        <div id="nav-links-container" class="relative flex items-center space-x-3 z-10 dashiell-text">
          <span id="hover-pill" class="absolute h-8 rounded-full bg-cream transition-all duration-300 -z-10"></span>
          <a href="../about" id="about-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--cream)">about</a>
          <a href="../work" id="work-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--cream)">work</a>
          <a href="../contact" id="contact-link" class="nav-link text-sm md:text-base px-2 py-1"
            data-default-color="var(--dark-blue)">contact</a>
        </div>
      </div>
    </nav>

    <!-- Main Content Split Layout -->
    <div id="video-split-layout"
      class="absolute inset-0 pt-28 px-4 md:px-8 pb-8 flex flex-col md:flex-row gap-6 z-10 pointer-events-none">

      <!-- Left Panel: Project List -->
      <div id="project-list"
        class="w-full md:w-1/3 flex flex-col gap-5 overflow-y-auto pb-24 md:pb-0 h-full hide-scrollbar pointer-events-auto">
        <!-- Injected via JS -->
      </div>

      <!-- Right Panel: Article Container -->
      <div id="project-article-container" class="hidden md:block w-full md:w-2/3 h-full relative pointer-events-auto">

        <!-- Mobile Back Button -->
        <button id="mobile-back-btn" onclick="goBackToProjects()"
          class="hidden md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 pill-button bg-cream/90 text-dark-blue border border-cream shadow-2xl backdrop-blur-md px-8 py-3 items-center gap-2 z-[100] transition-transform hover:scale-105 active:scale-95 whitespace-nowrap">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.0" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
          </svg>
          All Projects
        </button>

        <div id="articles-wrapper"
          class="bg-cream/10 backdrop-blur-xl rounded-2xl border border-cream/20 p-6 md:p-10 overflow-y-auto h-full hide-scrollbar shadow-2xl">
          <!-- Articles Injected via JS -->
        </div>
      </div>
    </div>

  </div>


  <script src="scripts.js"></script>
</body>

</html>
