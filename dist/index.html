<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A0BBA8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#174C38" media="(prefers-color-scheme: dark)">
  <title>Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="./images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="./images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Preload foreground image for instant rendering with the preloader -->
  <link rel="preload" as="image" href="./images/foreground.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body
  class="bg-[#242c3d] dark:bg-[#242c3d] text-[#174C38] dark:text-[#174C38] flex flex-col items-center justify-center h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="./images/krml25-wordmark-cream.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Foreground Image Layer (placed globally for preloader layering and interactive pass-through) -->
  <div class="foreground-image absolute inset-0 z-[10000] pointer-events-none will-change-transform"></div>

  <!-- Core Content -->
  <div id="main-content" class="h-full w-full flex flex-col items-center justify-center transition-all duration-500">

    <!-- Header / Navbar -->
    <header class="absolute top-8 left-0 right-0 z-10 flex justify-center px-6">
      <a href="./index.html" class="logo-link">
        <img src="./images/krml25-wordmark-cream.svg" alt="KRML" class="h-8 md:h-10 w-auto">
      </a>
    </header>

    <!-- Background -->
    <div class="background-image absolute inset-0 -z-30 will-change-transform"></div>

    <div class="absolute inset-0 -z-10 bg-black opacity-10"></div>

    <!-- Hero Text -->
    <div class="text-center relative z-10">
      <h1 class="h1-text text-5xl md:text-7xl lg:text-8xl font-bold mb-4 text-[#e9e1db]">
        Come back soon?
      </h1>
      <p class="text-lg md:text-xl lg:text-2xl font-medium px-4 dashiell-text max-w-lg mx-auto text-[#e9e1db]">
        I've got some changes underway right now.
      </p>
    </div>
  </div>

  <!-- Social Links -->
  <div class="fixed bottom-8 flex space-x-4 z-10">
    <a href="mailto:evan@krml.me?subject=%F0%9F%91%8B" target="_blank" class="social-link w-7 h-7">
      <img src="./images/mail-cream.png" alt="Mail Icon" class="w-full h-full">
    </a>
    <a href="http://instagram.com/evankrummel/" target="_blank" class="social-link w-7 h-7">
      <img src="./images/insta-cream.png" alt="Instagram Icon" class="w-full h-full">
    </a>
    <a href="https://www.linkedin.com/in/krml" target="_blank" class="social-link w-7 h-7">
      <img src="./images/linkedin-cream.png" alt="LinkedIn Icon" class="w-full h-full">
    </a>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
