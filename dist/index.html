<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: dark)">
  <title>Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="./images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="./images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Preload foreground image for instant rendering with the preloader -->
  <link rel="preload" as="image" href="./images/foreground.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-blue': '#242c3d',
            'cream': '#e9e1db'
          }
        }
      }
    }
  </script>
</head>

<body
  class="bg-dark-blue dark:bg-dark-blue text-dark-blue dark:text-dark-blue flex flex-col items-center justify-center h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="./images/krml25-wordmark-cream.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Main Content Wrapper -->
  <div id="main-content" class="h-full w-full flex flex-col items-center justify-center transition-all duration-500">

    <!-- Background -->
    <div class="background-image absolute inset-0 -z-10"></div>
    <div class="absolute inset-0 -z-10 bg-black opacity-10"></div>

    <!-- Foreground Image Layer -->
    <div class="foreground-image absolute inset-0 z-5 pointer-events-none will-change-transform"></div>

    <!-- Hero Text -->
    <div class="text-center relative z-10">
      <h1 class="h1-text text-5xl md:text-6xl lg:text-8xl font-bold mb-4 text-cream">
        Hey, I'm Evan.
      </h1>
      <p class="text-lg md:text-xl lg:text-1.5xl font-medium px-4 dashiell-text max-w-2lg mx-auto text-cream">
        I'm a student and creative based <br class="md:hidden"> in Ann Arbor, Michigan.
      </p>
    </div>

    <!-- Navigation -->
    <nav id="navbar" class="fixed top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md md:max-w-lg px-6 py-3 
                           shadow-lg transition-all duration-300">
      <div class="flex items-center justify-between">
        <!-- Wordmark -->
        <img id="wordmark-logo" src="./images/krml25-wordmark-cream.svg" alt="Logo" class="h-8">

        <!-- Links -->
        <div id="nav-links-container" class="relative flex items-center space-x-3 z-10 dashiell-text">
          <span id="hover-pill" class="absolute h-8 rounded-full bg-dark-blue transition-all duration-300 -z-10"></span>
          <a href="/photo" id="photo-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--dark-blue)">photo</a>
          <a href="/video" id="video-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--dark-blue)">video</a>
          <a href="#contact-modal" id="contact-link" class="nav-link text-sm md:text-base px-2 py-1"
            data-default-color="var(--cream)">contact</a>
        </div>
      </div>
    </nav>

    <!-- Social Links -->
    <div class="fixed bottom-8 flex space-x-4">
      <a href="mailto:evan@krml.me?subject=%F0%9F%91%8B" target="_blank" class="social-link w-7 h-7">
        <img src="./images/mail-cream.png" alt="Mail Icon" class="w-full h-full">
      </a>
      <a href="http://instagram.com/evankrummel/" target="_blank" class="social-link w-7 h-7">
        <img src="./images/insta-cream.png" alt="Instagram Icon" class="w-full h-full">
      </a>
      <a href="https://www.linkedin.com/in/krml" target="_blank" class="social-link w-7 h-7">
        <img src="./images/linkedin-cream.png" alt="LinkedIn Icon" class="w-full h-full">
      </a>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contact-modal" class="modal">
    <div class="modal-content text-dark-blue dashiell-text
              w-[90%] max-w-md h-[360px] py-4 px-6 flex flex-col items-center rounded-xl">
      <!-- Header (stays at the top of the box) -->
      <div class="w-full flex justify-between items-start mb-2">
        <h2 class="h1-text text-2xl font-bold text-dark-blue">Let's talk.</h2>
        <span class="close-button" data-modal="contact-modal">&times;</span>
      </div>

      <!-- Body: occupies remaining space and centers its contents -->
      <div class="flex-1 w-full flex flex-col items-center justify-center space-y-3 text-center">
        <!-- Photo -->
        <img src="./images/circle-contact.png" alt="Evan Krummel" class="w-28 h-28 object-cover rounded-lg">

        <!-- Name -->
        <h3 class="h1-text text-3xl font-bold text-dark-blue">Evan Krummel</h3>

        <!-- Subheading -->
        <p class="text-xl font-medium text-dark-blue">Student & Creative Professional</p>

        <!-- Social Icons -->
        <div class="flex space-x-4 mt-2">
          <a href="mailto:evan@krml.me?subject=%F0%9F%91%8B" target="_blank" class="social-link w-7 h-7">
            <img src="./images/mail-base.png" alt="Mail Icon" class="w-full h-full">
          </a>
          <a href="http://instagram.com/evankrummel/" target="_blank" class="social-link w-7 h-7">
            <img src="./images/insta-base.png" alt="Instagram Icon" class="w-full h-full">
          </a>
          <a href="https://www.linkedin.com/in/krml" target="_blank" class="social-link w-7 h-7">
            <img src="./images/linkedin-base.png" alt="LinkedIn Icon" class="w-full h-full">
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
