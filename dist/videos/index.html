<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A0BBA8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#174C38" media="(prefers-color-scheme: dark)">
  <title>Videos - Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/videos">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[#174C38] text-[#A0BBA8] min-h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="../images/krml25-wordmark.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Main Content -->
  <div id="main-content" class="min-h-screen w-full flex flex-col transition-all duration-500">
    
    <!-- Navigation -->
    <nav id="navbar" class="fixed top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md md:max-w-lg px-6 py-3 
                           shadow-lg transition-all duration-300 z-50">
      <div class="flex items-center justify-between">
        <!-- Wordmark -->
        <a href="../index.html">
          <img id="wordmark-logo" src="../images/krml25-wordmark.png" alt="Logo" class="h-8">
        </a>

        <!-- Links -->
        <div id="nav-links-container" class="relative flex items-center space-x-3 z-10 dashiell-text">
          <span id="hover-pill" class="absolute h-8 rounded-full bg-[#174C38] transition-all duration-300 -z-10"></span>
          <a href="/photos" id="photo-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]" data-default-color="#174C38">photo</a>
          <a href="/videos" id="video-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]" data-default-color="#E9E1DB">video</a>
          <a href="#contact-modal" id="contact-link" class="nav-link text-sm md:text-base px-2 py-1" data-default-color="#174C38">contact</a>
        </div>
      </div>
    </nav>

    <!-- Video Content -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-24 md:py-32">
      <div class="w-full max-w-4xl">
        <div class="text-[#A0BBA8] dashiell-text">
          <div class="flex justify-between items-start w-full mb-4">
            <h2 class="h1-text text-2xl font-bold text-[#A0BBA8]">Hmm... not much here just yet...</h2>
          </div>
          <div class="relative w-full overflow-hidden rounded-lg group video-container">
            <p class="mt-4 text-[#A0BBA8]">so enjoy this video of the sunset in the meantime. cheers.</p>
            <video id="video-player" loop playsinline muted
                   src="../images/sunset.mov"></video>
            <button id="video-mute-btn" class="absolute bottom-4 right-4 text-white p-2 rounded-full bg-black bg-opacity-50 
                                               transition-transform duration-200 hover:scale-110">
              <img id="volume-on" class="w-6 h-6 hidden" src="../images/unmute.png" alt="Unmute">
              <img id="volume-off" class="w-6 h-6" src="../images/mute.png" alt="Mute">
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contact-modal" class="modal">
    <div class="modal-content text-[#174C38] dashiell-text
                w-[90%] max-w-md h-[360px] py-4 px-6 flex flex-col items-center rounded-xl">
      <!-- Header (stays at the top of the box) -->
      <div class="w-full flex justify-between items-start mb-2">
        <h2 class="h1-text text-2xl font-bold text-[#174C38]">Let's talk.</h2>
        <span class="close-button" data-modal="contact-modal">&times;</span>
      </div>

      <!-- Body: occupies remaining space and centers its contents -->
      <div class="flex-1 w-full flex flex-col items-center justify-center space-y-3 text-center">
        <!-- Photo -->
        <img src="../images/circle-contact.png" alt="Evan Krummel" class="w-28 h-28 object-cover rounded-lg">

        <!-- Name -->
        <h3 class="h1-text text-3xl font-bold text-[#174C38]">Evan Krummel</h3>

        <!-- Subheading -->
        <p class="text-xl font-medium text-[#174C38]">Student & Creative Professional</p>

        <!-- Social Icons -->
        <div class="flex space-x-4 mt-2">
          <a href="mailto:evan@krml.me?subject=%F0%9F%91%8B" target="_blank" class="w-7 h-7">
            <img src="../images/mail-base.png" alt="Mail Icon" class="w-full h-full">
          </a>
          <a href="http://instagram.com/evankrummel/" target="_blank" class="w-7 h-7">
            <img src="../images/insta-base.png" alt="Instagram Icon" class="w-full h-full">
          </a>
          <a href="https://www.linkedin.com/in/krml" target="_blank" class="w-7 h-7">
            <img src="../images/linkedin-base.png" alt="LinkedIn Icon" class="w-full h-full">
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts.js"></script>
</body>
</html>
