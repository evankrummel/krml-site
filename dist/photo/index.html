<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#242c3d" media="(prefers-color-scheme: dark)">
  <title>Photography - Evan Krummel</title>

  <link rel="canonical" href="https://www.evankrummel.com/photo">

  <!-- Light mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-light.png" media="(prefers-color-scheme: light)">

  <!-- Dark mode favicon -->
  <link rel="icon" type="image/png" href="../images/favicon-dark.png" media="(prefers-color-scheme: dark)">

  <!-- Preload foreground image for instant rendering with the preloader -->
  <link rel="preload" as="image" href="../images/foreground.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'dark-blue': '#242c3d',
            'cream': '#e9e1db'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-dark-blue dark:bg-dark-blue text-dark-blue dark:text-dark-blue min-h-screen">

  <!-- Preloader -->
  <div id="preloader" class="preloader">
    <img src="../images/krml25-wordmark-cream.svg" alt="Loading" class="preloader-logo">
  </div>

  <!-- Main Content -->
  <div id="main-content" class="min-h-screen w-full flex flex-col transition-all duration-500">
  
    <!-- Background -->
    <div class="background-image fixed inset-0 -z-30 will-change-transform"></div>
    <div class="fixed inset-0 -z-10 bg-black opacity-10"></div>

    <!-- Foreground Image Layer -->
    <div class="foreground-image fixed inset-0 z-5 pointer-events-none will-change-transform"></div>

    <!-- Navigation -->
    <nav id="navbar" class="fixed top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md md:max-w-lg px-6 py-3 
                           shadow-lg transition-all duration-300 z-50">
      <div class="flex items-center justify-between">
        <!-- Wordmark -->
        <a href="../index.html">
          <img id="wordmark-logo" src="../images/krml25-wordmark-cream.svg" alt="Logo" class="h-8">
        </a>

        <!-- Links -->
        <div id="nav-links-container" class="relative flex items-center space-x-3 z-10 dashiell-text">
          <span id="hover-pill" class="absolute h-8 rounded-full bg-dark-blue transition-all duration-300 -z-10"></span>
          <a href="/photo" id="photo-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--dark-blue)">photo</a>
          <a href="/video" id="video-link" class="nav-link text-sm md:text-base px-2 py-2 my-[-0.5rem]"
            data-default-color="var(--dark-blue)">video</a>
          <a href="../contact" id="contact-link" class="nav-link text-sm md:text-base px-2 py-1"
            data-default-color="var(--cream)">contact</a>
        </div>
      </div>
    </nav>

    <!-- Content (removed per user request) -->
  </div>


  <script src="../scripts.js"></script>
</body>

</html>
