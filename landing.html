<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evan's Temporary Site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dashiell+Text:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Superior+Title:wght@700&display=swap');

        body {
            font-family: 'Dashiell Text', sans-serif;
            overflow: hidden; /* Prevents scrolling */
        }

        .h1-text {
            font-family: 'Superior Title', serif;
        }
        
        /* The CSS for your background image */
        .background-image {
            background-size: cover;
            background-position: center;
        }

        .pill-button {
            border-radius: 9999px;
            padding: 0.25rem 1rem;
            font-weight: 500;
        }

        @media (max-width: 767px) {
            .navbar {
                top: auto;
                bottom: 0;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body class="bg-white text-[#174C38] flex flex-col items-center justify-center h-screen">

    <!-- Background Image -->
    <!-- Replace the URL below with your actual background image URL -->
    <div class="background-image absolute inset-0 -z-10" style="background-image: url('YOUR_IMAGE_URL_HERE');"></div>

    <!-- Main Content -->
    <div class="text-center">
        <h1 class="h1-text text-5xl md:text-7xl lg:text-8xl font-bold mb-4" style="color: #174C38;">Hey, I'm Evan</h1>
    </div>

    <!-- Navigation Bar -->
    <nav id="navbar" class="navbar fixed top-8 left-1/2 transform -translate-x-1/2 w-5/12 max-w-2xl px-3 py-2 bg-[#A0BBA8] bg-opacity-70 backdrop-blur-md rounded-full shadow-lg transition-all duration-300">
        <div class="flex items-center justify-between">
            <!-- Wordmark as an image -->
            <!-- Make sure 'krml25-wordmark.png' is in the 'images' folder inside your public directory -->
            <img src="./images/krml25-wordmark.png" alt="Your Logo" class="h-10">

            <!-- Links -->
            <div class="flex items-center space-x-3">
                <a href="#" class="text-sm md:text-base hover:text-gray-600">Photo</a>
                <a href="#" class="text-sm md:text-base hover:text-gray-600">Video</a>
                <a href="#" class="text-sm md:text-base">
                    <button class="pill-button bg-[#174C38] text-[#E9E1DB] hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-white">Contact</button>
                </a>
            </div>
        </div>
    </nav>
    
    <script>
        window.onload = function() {
            const navbar = document.getElementById('navbar');
            
            // Function to check screen size and update navbar position
            function updateNavbarPosition() {
                if (window.innerWidth <= 767) {
                    navbar.classList.remove('top-8');
                    navbar.classList.add('bottom-8');
                } else {
                    navbar.classList.remove('bottom-8');
                    navbar.classList.add('top-8');
                }
            }
            
            // Initial call and event listener for screen resize
            updateNavbarPosition();
            window.addEventListener('resize', updateNavbarPosition);
        }
    </script>
</body>
</html>
